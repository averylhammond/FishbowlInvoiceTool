name: Unit Test Workflow

# Run the unit tests pipeline on pull requests to main
on:
  pull_request:
    branches: [ main ]

# Allow for the job to be ran manually from the GitHub Actions UI
  workflow_dispatch:

# Read-only access is all this job needs: it only runs pytest.
permissions:
  contents: read

# Cancel a still-running check when a newer push to the same ref supersedes it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    # Give the job a name to link into the Github Rules UI
    name: Unit Test CI Check

    # Pinned rather than ubuntu-latest: setup-python publishes no 3.11.9 build for
    # Ubuntu 26.04, which ubuntu-latest moved to
    runs-on: ubuntu-24.04

    # Checkout repo. The unit tests touch no real files, so the private
    # submodule holding the test data is deliberately not checked out.
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Set up Python environment
    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-version: "3.11.9"
        cache: 'pip'
        cache-dependency-path: requirements/dev.txt

    # Install development project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    # Run unit tests with pytest
    - name: Run unit tests
      run: |
        pytest tests/
